# The IoT ADB instance connectionthis is setup manually as we need a specific oracle driver, so we also disable the default data soruce
datasources.default.enabled=false
# the variables are split out to enable them to be provided externally for enhanced security, for example env vars or a K8S vault based secret
#iotdatacache.url=tcps:adb.${iotdatacache.ociregion}.oraclecloud.com:1521/${iotdatacache.connectionname}.adb.oraclecloud.com
# these are deliberately set as being empty as we are using the db token auth method, we need the properties to exist, but be empty for that to trigger.
#iotdatacache.username=
#iotdatacache.password=

iotdatacache.oci.dbtoken.scope=urn:oracle:db::id::${oci.dbtoken.compartment}

iotdatacache.jdbc.doconnectiontestread.enabled=false
iotdatacache.jdbc.doconnectiontestread.order=0

# enable readers / listeners as required

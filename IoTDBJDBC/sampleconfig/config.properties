# If using the telemetry DB upload then you will need to set the following
# set true to enable this output module
messagehandler.output.normalizeddata.timeseries.enabled=true
# the order in the normalizeddata handlers list this will run in (higher means runs later)
#messagehandler.output.normalizeddata.timeseries.order=10
# successfully sent data does not get handed on
#messagehandler.output.normalizeddata.timeseries.sentdataiscompleted=true
# the path element of the oauth endpoint (this is not the hostname or http/https protocol)
# you get this from the telemetry DB engpoints - see the timeseries docs on that, it's unlikely to change, but best double check
#messagehandler.output.normalizeddata.timeseries.oauth.path=/tel/token
#messagehandler.output.normalizeddata.timeseries.oauth.url=<oauth https protocol / hostname / port>
# The x & y values seem to vary depending on if it's oauth or metrics access
#messagehandler.output.normalizeddata.timeseries.oauth.query.x=zep-78
#messagehandler.output.normalizeddata.timeseries.oauth.query.y=9021
# username and password for a user with ingest abilities to the workspace
#messagehandler.output.normalizeddata.timeseries.oauth.username=<username>
#messagehandler.output.normalizeddata.timeseries.oauth.password=<users password>
#messagehandler.output.normalizeddata.timeseries.oauth.tenancyocid=<ocid of the tenancy>
#messagehandler.output.normalizeddata.timeseries.oauth.databasename=<db name, e.g. iottelemetry>
# you get this from the telemetry DB engpoints - see the timeseries docs on that, it's unlikely to change, but best double check
#messagehandler.output.normalizeddata.timeseries.metrics.url=<metics https protocol / hostname / port>
#messagehandler.output.normalizeddata.timeseries.metrics.path=/tel/v1/metrics
# these are some kind of magic number, engineering tell me they should not change, but I'm not convinced by that
#messagehandler.output.normalizeddata.timeseries.metrics.query.x=zep-78
#messagehandler.output.normalizeddata.timeseries.metrics.query.y=9021

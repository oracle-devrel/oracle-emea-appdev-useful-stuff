# message handler filters look at the data and decide if it will be passed to the nest step in the message handling pipeline
#
# Note that several of the filters use a cache for things like the device model details, the cache required the property iotdatacache.schemaname to be set
# you can control pre-loading of the cache data form the iot service using these, they both default to true, so set to false to disable them
# Note that there is only once instance, so these are global settings
# devicemodelinstancescache.preloadexistingmodels=true
# devicemodelinstancescache.preloadexistinginstances=true
#
# the cache used the DB connection, you MUST have set the properties as shown in the sampleconfigsecure/configsecure.yml for that to be able to run
# those are 
# iotdatacache.schemaname: "<IOT Domain Shortid>__iot"
# iotdatacache.ociregion: "uk-london-1"
# iotdatacache.connectionname: "<The name of the adb low connection e.g. abc123_xyz789.low - see the iot domain group page for the details>"

#
# raw data filters work on the incoming data
# filter raw data based on the endpoint
#
# filter raw data based on the content type
#messagehandler.filter.rawdata.contenttype.enabled=true
#messagehandler.filter.rawdata.contenttype.order=10
#the content type e.g. text/plain or application/json
#messagehandler.filter.rawdata.contenttype.type
#
# filter raw data based on the raw data device model (if there is one)
#
#messagehandler.filter.rawdata.devicemodelfilter.order=10
#messagehandler.filter.rawdata.devicemodelfilterenabled=false
# the display name of the model - this is case sensitive !
#messagehandler.filter.rawdata.devicemodelfilter.modelname=homebattery
#Pre-load the known model instance data at startup or do it lazily when a new instance is encountered
#messagehandler.filter.rawdata.devicemodelfilter.preloadexistinginstances=true
#
# checking against multiple device models
#messagehandler.filter.rawdata.devicemodelsfilter.order=10
#messagehandler.filter.rawdata.devicemodelsfilterenabled=false
# the display name of the model, you shoudl have at least one for this to work
#messagehandler.filter.rawdata.devicemodelsfilter.modelnames[0]=homeBattery
#messagehandler.filter.rawdata.devicemodelsfilter.modelnames[1]=homeHeating
# set this to true for case insensitive checks homeBattery == homebattery (all comparisons are done lower case) false to be case sensitive homeBattery != homebattery
# messagehandler.filter.rawdata.devicemodelsfilter.caseinsensitive=true
# note that missing models or null model names will automatically be treated as not matching
#
#messagehandler.filter.rawdata.endpointfilter.enabled=true
#messagehandler.filter.rawdata.endpointfilter.order=20
# the string to look for, or a regexp to be found within the content path
#messagehandler.filter.rawdata.endpointfilter.regexp=sonnen
# is character matching case insensitive (default false)
#messagehandler.filter.rawdata.endpointfilter.caseinsensitive=false
#Are we looking for the rexexp (default FOUND) or looking for it not to be there (NOT_FOUND)
#messagehandler.filter.rawdata.endpointfilter.findoutcome=FOUND

# normalized data filters can look at the actual message contents once it'sbeen processed.
#
# a filter that looks at the type of the JSON data in the request
# messagehandler.filter.normalizeddata.contentjsontypefilter.order=10
# messagehandler.filter.normalizeddata.contentjsontypefilter.enabled=false
# there must be at least one entry like of the content type, see OracleJsonTYpe documentation for the options
# messagehandler.filter.normalizeddata.contentjsontypefilter.contentype[0]=DECIMAL
# messagehandler.filter.normalizeddata.contentjsontypefilter.contentype[1]=OBJECT
# messagehandler.filter.normalizeddata.contentjsontypefilter.contentype[2]=DOUBLE
# are we looking for when the content type is in the specified set above if so set to FOUND (default), if you want to invert to match content types not in the set make this NOT_FOUND
# messagehandler.filter.normalizeddata.contentjsontypefilter.filteronmatches=FOUND
#
#
# filter normalized based on applying a regexp to the content path 
#messagehandler.filter.normalizeddata.contentpathregexpfilter.enabled=true
#messagehandler.filter.normalizeddata.contentpathregexpfilter.order=20
# the string to look for, or a regexp to be found within the content path
#messagehandler.filter.normalizeddata.contentpathregexpfilter.regexp=Solar
# is character matching case insensitive (default false)
#messagehandler.filter.normalizeddata.contentpathregexpfilter.caseinsensitive=false
#Are we looking for the rexexp (default FOUND) or looking for it not to be there (NOT_FOUND)
#messagehandler.filter.normalizeddata.contentpathregexpfilter.findoutcome=FOUND
#
# This is a slightly different version than the above in that it looks cof multiple content paths, but doesn't support using a regexp, only strings
# messagehandler.filter.normalizeddata.contentpathsfilter.enabled=true
# messagehandler.filter.normalizeddata.contentpathsfilter.order=10
# you need to specify the content paths to use here (these are examples), there should be at least one, and unless caseInsensitive is set the testing is case sensitive
# messagehandler.filter.normalizeddata.contentpathsfilter.matchingcontentpath[0]=generationRate
# messagehandler.filter.normalizeddata.contentpathsfilter.matchingcontentpath[1]=solarIn
# messagehandler.filter.normalizeddata.contentpathsfilter.matchingcontentpath[2]=powerOut
# set this to FOUND if you are looking for the path to be in the provided paths, NOT_FOUND to see if it is not in the set
# messagehandler.filter.normalizeddata.contentpathsfilter.findoutcome=FOUND
#
# Filter normalized data based on the device model (if there is one)
#
#messagehandler.filter.normalizeddata.devicemodelfilter.order=10
#messagehandler.filter.normalizeddata.devicemodelfilterenabled=false
# the display name of the model - this is case sensitive !
#messagehandler.filter.normalizeddata.devicemodelfilter.modelname=homebattery
#Pre-load the known model instance data at startup or do it lazily when a new instance is encountered
#messagehandler.filter.normalizeddata.devicemodelfilter.preloadexistinginstances=true
#
# checking against multiple device models
#messagehandler.filter.normalizeddata.devicemodelsfilter.order=10
#messagehandler.filter.normalizeddata.devicemodelsfilterenabled=false
# the display name of the model, you should have at least one for this to work
#messagehandler.filter.normalizeddata.devicemodelsfilter.modelnames[0]=homeBattery
#messagehandler.filter.normalizeddata.devicemodelsfilter.modelnames[1]=homeHeating
# set this to true for case insensitive checks homeBattery == homebattery (all comparisons are done lower case) false to be case sensitive homeBattery != homebattery
# messagehandler.filter.normalizeddata.devicemodelsfilter.caseinsensitive=true
# note that missing models or null model names will automatically be treated as not matching

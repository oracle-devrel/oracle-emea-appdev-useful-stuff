  - name: "Car Internal Temperature"
    doupload: true
    initaldelay: "PT1s"
    retrievalrate: "PT150s"
    devicekey: "CrIntrnlTmp"
    endpoint: "temperature"
    monitoredentities:
    - name: "Car internal Temperature"
      entityid: "sensor.tims_m3_temperature_inside"

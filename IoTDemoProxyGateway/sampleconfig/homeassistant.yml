      sendmode: "ALWAYS"
      iottype: "ENERGY_KILO_WATT_HOURS"
  - name: "Fridge Freezer"
    doupload: true
    initaldelay: "PT2s"
    retrievalrate: "PT60s"
    devicekey: "FrdgFrzrPwr"
    endpoint: "power"
    monitoredentities:
    - name: "Fridge Freezer Power usage"
      entityid: "sensor.refrigerator_power"

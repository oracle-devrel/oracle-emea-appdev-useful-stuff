home-assistant:
  api:
    auth_token: "<your HA token>"
    port: <Your HA port, might be 80 or 8123>
    host: <Your HA servers IP address, sometimes homeassistant.local will work>
    protocol: "http"
    url: ${home-assistant.api.protocol}://${home-assistant.api.host}:${home-assistant.api.port}
  monitored-entities:
  - name: "HomeBatteryManualReserve"
    doupload: true
    initaldelay: "PT3s"
    retrievalrate: "PT60s"
    devicekey: "SnnManRsrvSttngs"
    endpoint: "homebatterymanualreservesettings"
    monitoredentities:
    - name: "Repeat manual reserve daily"
      entityid: "input_boolean.sonnenmanualreservewindowrepeatdaily"
      iottype: "SWITCH"
      fieldname: "repeatmanualreserveenabled"
      sendmode: "ALWAYS"
    - name: "Manual reserve enabled"
      entityid: "input_boolean.sonnenmanualreservewindowenabled"
      iottype: "SWITCH"
      fieldname: "manualreserveenabled"
      sendmode: "ALWAYS"
  - name: "Sonnen charge level"
    doupload: true
    initaldelay: "PT2s"
    retrievalrate: "PT30s"
    devicekey: "SnnBatUsrChrg"
    endpoint: "energy"
    monitoredentities:
    - name: "Sonnen user charge level"
      entityid: "sensor.sonnenbatterie_200357_state_charge_user"
      iottype: "PERCENT"
      fieldname: "userchargepercent"
      sendmode: "ALWAYS"
  - name: "Kitchen Door"
    doupload: true
    initaldelay: "PT4s"
    retrievalrate: "PT10s"
    devicekey: "MyggbettKtchnDr"
    endpoint: "door"
    monitoredentities:
    - name: "Kitchen door sensor"
      entityid: "binary_sensor.myggbett_kitchen_door"
      fieldname: "dooropen"
      sendmode: "ALWAYS"
      iottype: "BINARY_ON_OFF"
  - name: "Garden Door"
    doupload: true
    initaldelay: "PT5s"
    retrievalrate: "PT10s"
    devicekey: "MyggbettGrdnDr"
    endpoint: "door"
    monitoredentities:
    - name: "Garden door sensor"
      entityid: "binary_sensor.myggbett_conservatory_door"
      fieldname: "dooropen"
      sendmode: "ALWAYS"
      iottype: "BINARY_ON_OFF"
  - name: "Front Door"
    doupload: true
    initaldelay: "PT5s"
    retrievalrate: "PT10s"
    devicekey: "MyggbettFrntDr"
    endpoint: "door"
    monitoredentities:
    - name: "Front door sensor"
      entityid: "binary_sensor.myggbett_front_door"
      fieldname: "dooropen"
      sendmode: "ALWAYS"
      iottype: "BINARY_ON_OFF"
  - name: "Garage Door"
    doupload: true
    initaldelay: "PT5s"
    retrievalrate: "PT10s"
    devicekey: "MyggbettGrgDr"
    endpoint: "door"
    monitoredentities:
    - name: "Garage door sensor"
      entityid: "binary_sensor.myggbett_garage_door"
      fieldname: "dooropen"
      sendmode: "ALWAYS"
      iottype: "BINARY_ON_OFF"
  - name: "UtilityLuminance"
    doupload: true
    initaldelay: "PT5s"
    retrievalrate: "PT10s"
    devicekey: "UtilIlluminance"
    endpoint: "illuminance"
    monitoredentities:
    - name: "Utility Illuminance"
      entityid: "sensor.utility_room_myggspray_utility_illuminance"
      fieldname: "lux"
      sendmode: "ALWAYS"
      iottype: "LUMINANCE"
  - name: "Filtered Grid Consumption"
    doupload: true
    initaldelay: "PT7s"
    retrievalrate: "PT10s"
    devicekey: "FiltGridCons"
    endpoint: "power"
    monitoredentities:
    - name: "Filtered grid"
      entityid: "sensor.filtered_grid_consumption"
      fieldname: "watts"
      sendmode: "ALWAYS"
      iottype: "POWER_WATTS"
  - name: "Filtered Battery flows"
    doupload: true
    initaldelay: "PT7s"
    retrievalrate: "PT10s"
    devicekey: "FltBttryPwrFlws"
    endpoint: "power"
    monitoredentities:
    - name: "Filtered battery power flows"
      entityid: "sensor.filtered_battery_power_flows"
      fieldname: "watts"
      sendmode: "ALWAYS"
      iottype: "POWER_WATTS"
  - name: "Solar Generation"
    doupload: true
    initaldelay: "PT8s"
    retrievalrate: "PT10s"
    devicekey: "SolGenTotal"
    endpoint: "power"
    monitoredentities:
    - name: "Solar Generation Combined"
      entityid: "input_number.solargenerationcombinedcurrent"
      fieldname: "watts"
      sendmode: "ALWAYS"
      iottype: "POWER_WATTS"
  - name: "Car Charger Power"
    doupload: true
    initaldelay: "PT8s"
    retrievalrate: "PT10s"
    devicekey: "CrChrgrPwr"
    endpoint: "power"
    monitoredentities:
    - name: "Car charging rate"
      entityid: "sensor.myenergi_zappi_20758989_power_ct_internal_load"

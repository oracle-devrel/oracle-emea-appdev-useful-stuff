gateway:
  identity:
    name: "HomeAssistantGateway1"
    devicekey: "hagateway"
  endpoint:
    base: "house/homeassistant"
    gatewaystatssubpath: "gateway/stats"
    gatewayconfigsubpath: "gateway/config"
    entitiessubpath: "entities"
  config:
    enabled: true
    publishrate: "1200s"
    initialdelay: "5s"
  stats:
    enabled: true
    publishrate: "60s"
    initialdelay: "60s"
